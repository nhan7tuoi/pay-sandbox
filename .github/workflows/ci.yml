name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, typecheck and e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server and dashboard
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: End-to-end tests (Stripe SDK, MoMo, ZaloPay, VNPay)
        run: npm test

      - name: Check the npm package contents
        if: matrix.node == 22
        run: npm pack --dry-run
