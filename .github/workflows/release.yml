name: Release

# Publishes to npm and creates a GitHub Release when a version tag is pushed:
#
#   npm version patch        # bumps package.json and creates the tag, e.g. v0.1.1
#   git push --follow-tags
#
# Publishing uses npm Trusted Publishing (OIDC): no npm token is stored in the
# repository. Configure it once on npmjs.com → pay-sandbox → Settings →
# Trusted Publisher → GitHub Actions, workflow filename `release.yml`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: End-to-end tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.version.outputs.dist-tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--generate-notes --verify-tag"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $FLAGS
